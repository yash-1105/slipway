[project]
name = "slipway-orchestrator"
version = "0.1.0"
description = "Slipway orchestrator: API, worker, CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.15",
    "openai>=1.57",
    "langgraph>=0.2.50",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[project.scripts]
slipway = "app.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "ASYNC",            # async correctness
    "S",                # bandit
    "BLE",              # blind except  -- CLAUDE.md: no bare except
    "T20",              # no print()
    "RUF",
]
ignore = ["S101"]       # assert is fine in tests; see per-file below

[tool.ruff.lint.per-file-ignores]
# The ASYNC rules exist to stop a blocking call stalling an event loop that
# has other work. A test is the only thing running: driving docker with
# subprocess.run and fetching a URL with urllib is exactly right there, and
# an async wrapper would only add indirection between the test and what it
# is asserting.
"tests/**" = ["S", "T20", "ASYNC210", "ASYNC221", "ASYNC240"]
"app/cli/**" = ["T20"]   # the CLI's job is to print

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped fixtures (the database engine) and the tests that use them
# must share one event loop, or asyncpg connections outlive the loop that
# created them and teardown fails with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Every test here is a function. Without this, pytest tries to collect
# domain classes named Test* -- TestOutcome, TestService -- and warns.
python_classes = []
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres and a real Docker daemon",
    "acceptance: drives the full loop end to end",
]

# ---------------------------------------------------------------------------
# import-linter  --  ADR 0001 (seams) and ADR 0002 (layering)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

# --- ADR 0002: layering ----------------------------------------------------

[[tool.importlinter.contracts]]
name = "L1 Layers point downward (ADR 0002)"
type = "layers"
# Names on one line are siblings and may not import each other. The entry
# points sit above the adapters, which sit above the composition root, which is
# the only thing that knows how a service is assembled.
layers = [
    "app.main | app.worker",
    "app.api | app.cli",
    "app.container",
    "app.services",
    "app.agents",
    "app.state | app.integrations | app.db",
    "app.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "L2 domain/ imports nothing else from app/ (ADR 0002)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.state", "app.integrations", "app.db",
    "app.config", "app.logging",
    "app.models", "app.runtimes", "app.sandbox", "app.deploy", "app.artifacts",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "L3 api/ and cli/ are thin adapters (ADR 0002)"
type = "forbidden"
source_modules = ["app.api", "app.cli"]
forbidden_modules = [
    "app.agents", "app.state", "app.integrations", "app.db", "app.worker",
    "app.models", "app.runtimes", "app.sandbox", "app.deploy", "app.artifacts",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "L4 services/ does not reach persistence directly (ADR 0002)"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.db", "app.main", "app.worker", "app.container", "app.api", "app.cli"]
allow_indirect_imports = true

# --- ADR 0001: the five seams ---------------------------------------------
# Only a seam's own factory may import that seam's implementations.
#
# `allow_indirect_imports = true` is what makes these contracts say the right
# thing. Without it, import-linter follows the chain
# container -> factory -> impl and reports the container -- but reaching an
# implementation *through the factory* is the entire design. What must never
# happen is a direct import, and that is what these now catch.

[[tool.importlinter.contracts]]
name = "S1 models seam: no implementation imported from outside (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.runtimes", "app.sandbox", "app.deploy", "app.artifacts",
]
forbidden_modules = ["app.models.impl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "S2 runtimes seam: no implementation imported from outside (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.models", "app.sandbox", "app.deploy", "app.artifacts",
]
forbidden_modules = ["app.runtimes.impl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "S3 sandbox seam: no implementation imported from outside (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.models", "app.runtimes", "app.deploy", "app.artifacts",
]
forbidden_modules = ["app.sandbox.impl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "S4 deploy seam: no implementation imported from outside (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.models", "app.runtimes", "app.sandbox", "app.artifacts",
]
forbidden_modules = ["app.deploy.impl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "S5 artifacts seam: no implementation imported from outside (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.models", "app.runtimes", "app.sandbox", "app.deploy",
]
forbidden_modules = ["app.artifacts.impl"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "S6 seam base modules stay pure: no vendor SDK in base.py (ADR 0001)"
type = "forbidden"
source_modules = [
    "app.models.base", "app.runtimes.base", "app.sandbox.base",
    "app.deploy.base", "app.artifacts.base",
]
forbidden_modules = ["openai", "langgraph", "sqlalchemy", "fastapi"]

# Env access itself cannot be expressed here -- import-linter reasons about
# modules, and `os.environ` is an attribute. `make check` runs
# scripts/check_env_access.py for that half. This contract covers what it can:
# nothing may pull configuration in from a file behind config.py's back.

[[tool.importlinter.contracts]]
name = "S7 no side-channel configuration loading (CLAUDE.md)"
type = "forbidden"
source_modules = [
    "app.main", "app.worker", "app.container", "app.api", "app.cli",
    "app.services", "app.agents", "app.domain", "app.state",
    "app.integrations", "app.db", "app.config",
    "app.models", "app.runtimes", "app.sandbox", "app.deploy", "app.artifacts",
]
forbidden_modules = ["dotenv", "configparser"]
allow_indirect_imports = true
